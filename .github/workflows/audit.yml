name: Dependency Audit

# Deliberately NOT part of the E2E workflow. An audit reports on the state of the npm
# registry, not on this repository — it can turn red without a single byte changing here.
# Running it on every push made documentation commits fail, which trains everyone to
# ignore red pipelines, including real failures.

on:
  schedule:
    # Mondays, 06:00 UTC
    - cron: '0 6 * * 1'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit
        run: npm audit --audit-level=high

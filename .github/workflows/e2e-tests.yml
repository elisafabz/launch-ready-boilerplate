name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        
    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: 2.22.0
        
    - name: Install dependencies
      run: npm ci

    - name: Check dependency tree (no invalid peers, no legacy-peer-deps)
      run: npm ls --depth=0

    - name: Lint
      run: npm run lint

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Start Supabase local instance
      run: |
        supabase start
        sb_status=$(supabase status -o json)
        api_url=$(echo "$sb_status" | jq -r '.API_URL')
        anon_key=$(echo "$sb_status" | jq -r '.ANON_KEY')
        echo "VITE_SUPABASE_URL=\"$api_url\"" > .env.test
        echo "VITE_SUPABASE_PUBLISHABLE_KEY=\"$anon_key\"" >> .env.test
      
    - name: Run Playwright tests
      run: npx playwright test
      env:
        CI: true
        
    - name: Stop Supabase
      if: always()
      run: supabase stop
        
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results
        path: test-results/
        retention-days: 30
